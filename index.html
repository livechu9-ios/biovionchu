<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>Vion Chu • Linkbio</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body data-theme="dark">

<canvas id="particles-canvas"></canvas>

<div class="bg-orb orb-1"></div>
<div class="bg-orb orb-2"></div>
<div class="bg-orb orb-3"></div>

<div class="cursor-dot"></div>
<div class="cursor-ring"></div>

<div class="floating-controls">
  <button class="ctrl-btn" id="theme-toggle" title="Đổi giao diện">
    <i class="fas fa-moon"></i>
  </button>
  <button class="ctrl-btn" id="share-btn" title="Chia sẻ">
    <i class="fas fa-share-nodes"></i>
  </button>
  <button class="ctrl-btn" id="confetti-btn" title="Bắn pháo hoa">
    <i class="fas fa-wand-magic-sparkles"></i>
  </button>
</div>

<div class="music-player">
  <button class="music-btn" id="music-toggle">
    <i class="fas fa-play"></i>
  </button>
  <div class="music-info">
    <span class="music-title">Lofi Vibes</span>
    <div class="music-visualizer paused" id="visualizer">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
  </div>
</div>

<div class="linkbio-card" id="card">
  <div class="avatar-wrapper" id="avatar">
    <img 
      class="avatar-img" 
      src="https://i.postimg.cc/3wVcBVQp/IMG-8890.jpg" 
      alt="Vion Chu"
    >
    <div class="verified-badge"><i class="fas fa-check"></i></div>
    <div class="status-dot"></div>
  </div>

  <div class="name">
    Vion Chu
  </div>

  <div class="typing-container">
    <span class="typing-text" id="typing-text"></span>
  </div>

  <div class="stats-row">
    <div class="stat-item">
      <span class="stat-value" data-count="12840">0</span>
      <span class="stat-label">Followers</span>
    </div>   
    <div class="stat-item">
      <span class="stat-value" data-count="256">0</span>
      <span class="stat-label">Posts</span>
    </div>
    <div class="stat-item">
      <span class="stat-value" data-count="980">0</span>
      <span class="stat-label">Likes</span>
    </div>
  </div>

  <div class="links">
    <svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
      <defs>
        <linearGradient id="zaloGradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#00c6ff"/>
          <stop offset="100%" stop-color="#c471ed"/>
        </linearGradient>
      </defs>
    </svg>

    <a href="https://surprised-yellow-felqfpe3.edgeone.dev/" class="link-item" data-url="https://surprised-yellow-felqfpe3.edgeone.dev/">
      <i class="fas fa-globe icon-left"></i>
      <span class="link-text">Website Free File</span>
      <i class="fas fa-chevron-right arrow"></i>
    </a>
    <a href="https://zalo.me/g/zeoqeg970" class="link-item" data-url="https://zalo.me/g/zeoqeg970">
      <svg class="zalo-svg" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
        <path d="M24 4C12.954 4 4 12.058 4 22c0 5.522 2.746 10.46 7.073 13.793-.234 2.02-.835 4.24-1.788 6.207-.243.503.146 1.077.696.98 3.166-.56 6.02-1.708 8.293-3.055C20.14 40.61 22.03 41 24 41c11.046 0 20-8.058 20-19S35.046 4 24 4z" fill="url(#zaloGradient)"/>
        <path d="M14.5 19.5h5.5v9h-5.5zM22 19.5h2.5v3.2c.6-1 1.8-1.7 3-1.7 2.2 0 3.5 1.4 3.5 3.8v3.7h-2.5v-3.5c0-1.2-.5-1.9-1.5-1.9s-1.5.7-1.5 2v3.4H22zM32.5 19c.9 0 1.6.7 1.6 1.6s-.7 1.6-1.6 1.6-1.6-.7-1.6-1.6.7-1.6 1.6-1.6zM31.3 22.3h2.5v6.2h-2.5z" fill="#ffffff"/>
      </svg>
      <span class="link-text">BOX ZALO</span>
      <i class="fas fa-chevron-right arrow"></i>
    </a>
    <a href="https://discord.gg/mydFcxVVn" class="link-item" data-url="https://discord.gg/mydFcxVVn">
      <i class="fab fa-discord icon-left"></i>
      <span class="link-text">NHÓM DISCORD HỖ TRỢ</span>
      <i class="fas fa-chevron-right arrow"></i>
    </a>
    <a href="https://surprised-yellow-felqfpe3.edgeone.dev/" class="link-item" data-url="https://surprised-yellow-felqfpe3.edgeone.dev/">
      <i class="fas fa-shopping-bag icon-left"></i>
      <span class="link-text">Store VIP</span>
      <i class="fas fa-chevron-right arrow"></i>
    </a>
  </div>

  <div class="socials">
    <a href="#" class="social-icon" data-url="https://tiktok.com/livechu.tiktoklove" aria-label="TikTok">
      <i class="fab fa-tiktok"></i>
    </a>
    <a href="#" class="social-icon" data-url="https://discord.com" aria-label="Discord">
      <i class="fab fa-discord"></i>
    </a>
  </div>

  <div class="footer-note">
    <i class="fas fa-crown"></i>
     LINKBIO
    <i class="fas fa-heart heart"></i>
    VIONCHU
  </div>
</div>

<div class="modal-overlay" id="share-modal">
  <div class="modal-content">
    <div class="modal-title">
      <i class="fas fa-qrcode"></i> Chia sẻ Linkbio
    </div>
    <div id="qr-code"></div>
    <div class="share-url">
      <input type="text" id="share-url-input" readonly>
      <button class="copy-btn" id="copy-btn">
        <i class="fas fa-copy"></i>
      </button>
    </div>
    <div class="share-buttons">
      <button class="share-btn fb" data-share="facebook"><i class="fab fa-facebook-f"></i></button>
      <button class="share-btn tw" data-share="twitter"><i class="fab fa-twitter"></i></button>
      <button class="share-btn tg" data-share="telegram"><i class="fab fa-telegram-plane"></i></button>
      <button class="share-btn wa" data-share="whatsapp"><i class="fab fa-whatsapp"></i></button>
    </div>
    <button class="modal-close" id="modal-close">Đóng</button>
  </div>
</div>

<div class="toast" id="toast">Đã sao chép!</div>

<audio id="bg-music" loop>
  <source src="https://amateur-crimson-lpwb61mm.edgeone.dev/" type="audio/mpeg">
</audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="script.js"></script>
</body>
</html>
